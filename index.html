<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Monthsary ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="heart">❤️</div>

        <h1>Happy Monthsary!</h1>

        <h2>To My Love 💕</h2>

        <p class="message">
            Another month has passed, and I'm still grateful
            that I get to have you in my life.
        </p>

        <p class="message">
            Thank you for all the love, care, laughter, and
            beautiful memories we've shared together.
        </p>

        <div class="monthsary">
            💗 <span>Happy 1st Monthsary!</span> 💗
        </div>

        <p class="love">
            I love you always and forever. ❤️
        </p>

        <button onclick="showMessage()">Click Me 💌</button>

        <p id="surprise"></p>

    </div>

    <script>
        function showMessage() {
            document.getElementById("surprise").innerHTML =
                "You will always have a special place in my heart. ❤️";
        }
    </script>

</body>
</html>
